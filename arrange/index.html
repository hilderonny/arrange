<!DOCTYPE html>
<html>

    <head>

        <script type="module">

            import * as Arrange from './js/arrange.js'

            // Benutzernamen anzeigen
            document.getElementById('username').innerHTML = localStorage.getItem('username')

            // Abmeldung
            document.getElementById('logout').addEventListener('click', async () => {
                await Arrange.logout()
            })

            // Private Datei im Benutzerordner speichern
            await Arrange.postPrivateFile('/halli/galli.txt', 'huiuiuiui')
            await Arrange.postPrivateFile('/halli/berta/vogel.txt', 'huiuiuiui')
            await Arrange.postPrivateFile('/halli/traumato/pikachu.txt', 'huiuiuiui')
            await Arrange.postPrivateFile('/nochmehr/murks.html', 'trallala')

            // Private Datei laden
            const fileContent = await (await Arrange.getPrivateFile('/halli/galli.txt')).text()
            console.log(fileContent)
            document.getElementById('private_iframe').src = `/api/files/${localStorage.getItem('userid')}/nochmehr/murks.html`

            // Leeres privates Verzeichnis erstellen
            await Arrange.createPrivatePath('/halli/lumpi')

            // Auflistung des privaten Verzeichnisses
            const privateDirContent = await (await Arrange.getPrivateFile('/halli')).json()
            console.log(privateDirContent)

            // Privates Verzeichnis rekursiv löschen
            await Arrange.deletePrivatePath('/halli')

            // Das gleiche mit öffentlichen Daten, die jeder Benutzer lesen und ändern kann
            await Arrange.postPublicFile('/holla/die.txt', 'waldfee')
            await Arrange.postPublicFile('/frumpf/hallalo.html', 'hornzpronz')

            // Leeres privates Verzeichnis erstellen
            await Arrange.createPublicPath('/holla/fronzel')

            // Auflistung des öffentlichen Verzeichnisses
            const publicDirContent = await (await Arrange.getPublicFile('/holla')).json()
            console.log(publicDirContent)

            const publicFileContent = await (await Arrange.getPublicFile('/holla/die.txt')).text()
            console.log(publicFileContent)
            document.getElementById('public_iframe').src = '/api/files/public/frumpf/hallalo.html'

            await Arrange.deletePublicPath('/holla')

            // Upload
            const privateFileInput = document.getElementById('privatefile')
            privateFileInput.addEventListener('change', async () => {
                const file = privateFileInput.files[0]
                await Arrange.uploadPrivateFile('/nochmehr/' + file.name, file, (progress) => {
                    document.getElementById('progress').value = progress
                })
            })

            const publicFileInput = document.getElementById('publicfile')
            publicFileInput.addEventListener('change', async () => {
                const file = publicFileInput.files[0]
                await Arrange.uploadPublicFile('/frumpf/' + file.name, file, (progress) => {
                    document.getElementById('progress').value = progress
                })
            })

            // Websockets
            let myWebClientId
            await Arrange.connectWebSocket(async (type, senderId, message) => {
                console.log(type, senderId, message)
                if (type === 0x01) {
                    myWebClientId = message
                    console.log(myWebClientId)
                }
            })

            await Arrange.joinRoom(815)
            await Arrange.sendMessageToRoom(815)
            await Arrange.sendMessageToClient(myWebClientId)
            await Arrange.leaveRoom(815)
            await Arrange.joinRoom(4711)
            await Arrange.leaveRoom(4711)


        </script>

    </head>

    <body>
        <p>Diese Seite testet die Anmeldung und Dateiverwaltung. Das meiste geschieht in der Konsole.</p>

        <p>Sie sind als Benutzer "<span id="username"></span>" angemeldet.</p>

        <p><button id="logout">Abmelden</button></p>

        <p>
            Private Datei
            <input id="privatefile" type="file"/>
        </p>

        <p>
            Öffentliche Datei
            <input id="publicfile" type="file"/>
        </p>

        <p>
            <progress id="progress" value="0" max="100"></progress>
        </p>

        <iframe id="private_iframe"></iframe>

        <iframe id="public_iframe"></iframe>

    </body>

</html>
