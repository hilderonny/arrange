<!DOCTYPE html>
<html>

    <head>

        <script type="module">

            import * as Arrange from '/arrange/js/arrange.mjs'
            import DatabaseObject from '/arrange/js/types/DatabaseObject.mjs'

            // Benutzernamen anzeigen
            document.getElementById('username').innerHTML = localStorage.getItem('username')

            // Abmeldung
            document.getElementById('logout').addEventListener('click', async () => {
                await Arrange.logout()
            })

            // Private Datei im Benutzerordner speichern
            await Arrange.postPrivateTextFile('/halli/galli.txt', 'huiuiuiui')
            await Arrange.postPrivateTextFile('/halli/berta/vogel.txt', 'huiuiuiui')
            await Arrange.postPrivateTextFile('/halli/traumato/pikachu.txt', 'huiuiuiui')
            await Arrange.postPrivateTextFile('/nochmehr/murks.html', 'trallala')

            // Private Datei laden
            const fileContent = await (await Arrange.getPrivateFile('/halli/galli.txt')).text()
            console.log(fileContent)
            document.getElementById('private_iframe').src = `/api/files/${localStorage.getItem('userid')}/nochmehr/murks.html`

            // Leeres privates Verzeichnis erstellen
            await Arrange.createPrivatePath('/halli/lumpi')

            // Auflistung des privaten Verzeichnisses
            const privateDirContent = await (await Arrange.getPrivateFile('/halli')).json()
            console.log(privateDirContent)

            // Privates Verzeichnis rekursiv löschen
            await Arrange.deletePrivatePath('/halli')

            // Das gleiche mit öffentlichen Daten, die jeder Benutzer lesen und ändern kann
            await Arrange.postPublicTextFile('/holla/die.txt', 'waldfee')
            await Arrange.postPublicTextFile('/frumpf/hallalo.html', 'hornzpronz')

            // Leeres privates Verzeichnis erstellen
            await Arrange.createPublicPath('/holla/fronzel')

            // Auflistung des öffentlichen Verzeichnisses
            const publicDirContent = await (await Arrange.getPublicFile('/holla')).json()
            console.log(publicDirContent)

            const publicFileContent = await (await Arrange.getPublicFile('/holla/die.txt')).text()
            console.log(publicFileContent)
            document.getElementById('public_iframe').src = '/api/files/public/frumpf/hallalo.html'

            await Arrange.deletePublicPath('/holla')

            // Upload
            const privateFileInput = document.getElementById('privatefile')
            privateFileInput.addEventListener('change', async () => {
                const file = privateFileInput.files[0]
                await Arrange.uploadPrivateBinaryFile('/nochmehr/' + file.name, file, (progress) => {
                    document.getElementById('progress').value = progress
                })
            })

            const publicFileInput = document.getElementById('publicfile')
            publicFileInput.addEventListener('change', async () => {
                const file = publicFileInput.files[0]
                await Arrange.uploadPublicBinaryFile('/frumpf/' + file.name, file, (progress) => {
                    document.getElementById('progress').value = progress
                })
            })

            // Websockets
            let myWebClientId
            await new Promise((resolve) => {
                Arrange.connectWebSocket(async (message) => {
                    console.log(message, new TextDecoder().decode(message.message))
                    if (message.type === 0x01) {
                        myWebClientId = message.clientId
                        console.log(myWebClientId)
                        resolve()
                    }
                })
            })

            await Arrange.joinRoom(815n)
            await Arrange.sendMessageToRoom(815n, "Hallo Raum")
            await Arrange.sendMessageToClient(myWebClientId, "Hallo Client")
            await Arrange.leaveRoom(815n)
            await Arrange.joinRoom(4711n)
            await Arrange.leaveRoom(4711n)
            await Arrange.joinRoom(3315n)
            await Arrange.sendMessageToRoom(3315n, "Hallo anderer Raum")

            // Datenbank
            const datenbankschemaVorher = {
                Testtabelle: {
                    Text: 'TEXT',
                    Nummer: 'INTEGER',
                    Wahrheit: 'INTEGER',
                    AndereWahrheit: 'INTEGER',
                    Nix: 'TEXT',
                },
                AndereTabelle: {
                    Nummer: 'INTEGER',
                },
                TabelleOhneIrgendwas: {},
                Vorgaenge: {
                    Name: 'TEXT',
                },
                Spuren: {
                    Name: 'TEXT',
                },
            }

            // Erst mal alles Alte löschen
            for (const tabellenname of [ 'Testtabelle', 'AndereTabelle', 'TabelleOhneIrgendwas', 'Vorgaenge', 'Spuren', 'Spurenaufgaben']) {
                await Arrange.deleteDatabaseTable('Testdatenbank', tabellenname)
            }
            // Schema aktualisieren
            await Arrange.updateDatabase('Testdatenbank', datenbankschemaVorher)
            // Datensatz erstellen, undefined als id mitgeben
            const neuerDatensatz = await Arrange.saveDatabaseRecord('Testdatenbank', 'Testtabelle', undefined, { Nummer: 1234, Wahrheit: true, AndereWahrheit: false, Text: `Hallo Welt`, Nix: undefined })
            console.log(neuerDatensatz)
            // Datensatz aktualisieren, nur die geänderten Felder
            await Arrange.saveDatabaseRecord('Testdatenbank', 'Testtabelle', neuerDatensatz.Id, { Nummer: 987, Text: `Huhu, 'Du' "Wurstel" \`Holla\` da!` })
            // SQL-Abfrage machen
            console.log(await Arrange.queryDatabase('Testdatenbank', 'SELECT * FROM Testtabelle'))
            // Datensatz löschen
            await Arrange.deleteDatabaseRecord('Testdatenbank', 'Testtabelle', neuerDatensatz.Id)

            // Datenbankobjekte

            class Testdatenbankobjekt extends DatabaseObject {
                static databaseName = 'Testdatenbank'
            }

            class Vorgang extends Testdatenbankobjekt {
                static tableName = 'Vorgaenge'
            }

            class Spur extends Testdatenbankobjekt {
                static tableName = 'Spuren'
            }

            class Spurenaufgabe extends Testdatenbankobjekt {
                static tableName = 'Spurenaufgaben'
            }

            const vorgang = new Vorgang({
                Name: 'Mein Vorgang',
            })
            console.log(await vorgang.save())
            const spur1 = new Spur({
                Name: 'Meine Spur',
            })
            console.log(await spur1.save())
            const spurAusDatenbank = await Spur.load(spur1.Id)
            console.log('spurAusDatenbank:', spurAusDatenbank)
            spurAusDatenbank.Name = 'Meine tolle Spur'
            console.log(await spurAusDatenbank.save())

            // Datenbankschema erweitern
            await Arrange.updateDatabase('Testdatenbank', {
                Spuren: {
                    Nummer: 'TEXT',
                    VorgangsId: 'TEXT REFERENCES Vorgaenge(Id) ON DELETE CASCADE',
                },
                Spurenaufgaben: {
                    Text: 'TEXT',
                    SpurenId: 'TEXT REFERENCES Spuren(Id) ON DELETE CASCADE',
                }
            })
            await spurAusDatenbank.delete()
            const spur2 = new Spur({
                VorgangsId: vorgang.Id,
                Name: 'Meine zweite Spur',
                Nummer: 'Spur 2',
            })
            console.log(await spur2.save())
            const spurenaufgabe = new Spurenaufgabe({
                Text: 'Mach was!',
                SpurenId: spur2.Id,
            })
            console.log(await spurenaufgabe.save())
            // Vor dem Löschen
            console.log(await Arrange.queryDatabase('Testdatenbank', 'SELECT * FROM Spuren'))
            console.log(await Arrange.queryDatabase('Testdatenbank', 'SELECT * FROM Spurenaufgaben'))
            await vorgang.delete()
            // Auch Spur 2 und Spurwenaufgaben müssen gelöscht sein, wenn Vorgang weg ist
            console.log(await Arrange.queryDatabase('Testdatenbank', 'SELECT * FROM Spuren'))
            console.log(await Arrange.queryDatabase('Testdatenbank', 'SELECT * FROM Spurenaufgaben'))
            // Und nochmal eine Spur einfügen, one dass es eine Referenz per Foreign Key gibt
            const spur3 = new Spur({
                Name: 'Dritte Spur',
                Nummer: 'Drei',
                VorgangsId: null, // Geht das auch mit Leertext? NÖ, Muss wirklich undefined oder null sein
            })
            console.log(await spur3.save())
            console.log(await Spur.load(spur3.Id))
            // Mal nur ein Feld aktualisieren
            await new Spur({ Id: spur3.Id, Nummer: '3 (Zahl)' }).save()
            console.log(await Spur.load(spur3.Id))
            // Alle Spuren gemappt mit Abfrage
            console.log(await Spur.query('SELECT * FROM Spuren'))
            await spur3.delete()

        </script>

    </head>

    <body>
        <p>Diese Seite testet die Anmeldung und Dateiverwaltung. Das meiste geschieht in der Konsole.</p>

        <p>Sie sind als Benutzer "<span id="username"></span>" angemeldet.</p>

        <p><button id="logout">Abmelden</button></p>

        <p>
            Private Datei

            <input id="privatefile" type="file"/>
        </p>

        <p>
            Öffentliche Datei
            <input id="publicfile" type="file"/>
        </p>

        <p>
            <progress id="progress" value="0" max="100"></progress>
        </p>

        <iframe id="private_iframe"></iframe>

        <iframe id="public_iframe"></iframe>

    </body>

</html>
